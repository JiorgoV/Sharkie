<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="./style.css">
    <link rel="icon" type="image/png" href="img/Alternative_Grafiken-Sharkie/Alternative Grafiken - Sharkie/1.Sharkie/1.IDLE/1.png">
    <title>Sharkie</title>
    <script src="./models/drawable-object.class.js"></script>
    <script src="./models/movable-object.class.js"></script>
    <script src="./models/background-object.class.js"></script>
    <script src="./models/character.class.js"></script>
    <script src="./models/puffer-fish.class.js"></script>
    <script src="./models/jellyfish.class.js"></script>
    <script src="./models/dangerous-jellyfish.class.js"></script>
    <script src="./models/endboss.class.js"></script>
    <script src="./models/coin.class.js"></script>
    <script src="./models/poison.class.js"></script>
    <script src="./models/throwable-object.class.js"></script>
    <script src="./models/poison-bubble.class.js"></script>
    <script src="./models/light.class.js"></script>
    <script src="./models/endboss-bar.class.js"></script>
    <script src="./models/keyboard.class.js"></script>
    <script src="./models/level.class.js"></script>
    <script src="./levels/level1.js"></script>
    <script src="./models/sound-manager.class.js"></script>
    <script src="./models/world.class.js"></script>
    <script src="./js/game.js"></script>
</head>

<body onload="init()">

    <div id="splash-screen">
        <h1>Sharkie</h1>
        <button class="enter-btn" onclick="showMainMenu()">Enter</button>
    </div>

    <div id="rotate-hint">
        <div id="rotate-content">
            <span id="rotate-icon">📱</span>
            <p>Please rotate your device to play</p>
        </div>
    </div>

    <h1 id="main-title" class="hidden">Sharkie</h1>

    <!-- Start Buttons -->
    <div class="hidden" id="start-buttons">
        <div class="start-btn-item" onclick="openSettings()">
            <img src="img/Alternative_Grafiken-Sharkie/Alternative Grafiken - Sharkie/7.Icons/icons8-settings-144.svg">
            <span>Settings</span>
        </div>
        <div class="start-btn-item" onclick="openInstructions()">
            <img src="img/Alternative_Grafiken-Sharkie/Alternative Grafiken - Sharkie/7.Icons/help.png">
            <span>Help</span>
        </div>
        <div class="start-btn-item" onclick="startGame()">
            <img src="img/Alternative_Grafiken-Sharkie/Alternative Grafiken - Sharkie/6.Botones/Start/3.png">
            <span>Start</span>
        </div>
    </div>

    <!-- Settings Dialog -->
    <div id="settings-dialog" class="hidden">
        <div id="settings-content">
            <span class="close-btn" onclick="closeSettings()">✕</span>
            <h2>Settings</h2>
            <div class="settings-row">
                <span>Musik</span>
                <input type="range" id="music-slider" min="0" max="1" step="0.1" value="0.5" oninput="changeMusicVolume(this.value)">
            </div>
            <div class="settings-row">
                <span>FX</span>
                <input type="range" id="fx-slider" min="0" max="1" step="0.1" value="0.5" oninput="changeFxVolume(this.value)">
            </div>
        </div>
    </div>

    <!-- Instructions Dialog -->
    <div id="instructions-dialog" class="hidden">
        <div id="instructions-content">
            <span class="close-btn" onclick="closeInstructions()">✕</span>
            <div class="instructions-row">
                <img src="img/Alternative_Grafiken-Sharkie/Alternative Grafiken - Sharkie/6.Botones/Tittles/Move title.png">
                <img src="img/Alternative_Grafiken-Sharkie/Alternative Grafiken - Sharkie/6.Botones/Key/arrow keys.png">
            </div>
            <div class="instructions-row">
                <img src="img/Alternative_Grafiken-Sharkie/Alternative Grafiken - Sharkie/6.Botones/Tittles/Attack tittle.png">
                <img src="img/Alternative_Grafiken-Sharkie/Alternative Grafiken - Sharkie/6.Botones/Key/D key.png">
                <img src="img/Alternative_Grafiken-Sharkie/Alternative Grafiken - Sharkie/6.Botones/Key/Space Bar key.png">
            </div>
        </div>
    </div>

    <div class="hidden" id="game-container">

        <!-- Game Over Screen -->
        <div id="gameover-screen" class="hidden">
            <img id="gameover-title" src="img/Alternative_Grafiken-Sharkie/Alternative Grafiken - Sharkie/6.Botones/Tittles/Game Over/Recurso 10.png">
            <img class="btn-action" src="img/Alternative_Grafiken-Sharkie/Alternative Grafiken - Sharkie/6.Botones/Try again/Recurso 17.png" onclick="restartGame()">
            <img class="btn-action" src="img/Alternative_Grafiken-Sharkie/Alternative Grafiken - Sharkie/6.Botones/Start/3.png" onclick="goHome()">
        </div>

        <!-- You Win Screen -->
        <div id="youwin-screen" class="hidden">
            <img id="youwin-title" src="img/Alternative_Grafiken-Sharkie/Alternative Grafiken - Sharkie/6.Botones/Tittles/You win/Recurso 22.png">
            <img class="btn-action" src="img/Alternative_Grafiken-Sharkie/Alternative Grafiken - Sharkie/6.Botones/Try again/Recurso 17.png" onclick="restartGame()">
            <img class="btn-action" src="img/Alternative_Grafiken-Sharkie/Alternative Grafiken - Sharkie/6.Botones/Start/3.png" onclick="goHome()">
        </div>

        <!-- Canvas -->
        <canvas id="canvas" width="720" height="480" class="hidden"></canvas>
        <div id="btn-fullscreen-ingame" onclick="toggleFullscreen()" class="hidden">⛶</div>
        <div id="btn-mute-ingame" onclick="toggleMute()" class="hidden">🔊</div>
        <img id="btn-pause" src="img/Alternative_Grafiken-Sharkie/Alternative Grafiken - Sharkie/7.Icons/Grey/icon_cross.svg" onclick="togglePause()" class="hidden">

        <!-- Mobile Touch Buttons -->
        <div id="mobile-controls">
            <div id="dpad">
                <div class="touch-btn-arrow" id="btn-up" ontouchstart="keyboard.UP = true" ontouchend="keyboard.UP = false"></div>
                <div id="dpad-middle">
                    <div class="touch-btn-arrow" id="btn-left" ontouchstart="keyboard.LEFT = true" ontouchend="keyboard.LEFT = false"></div>
                    <div class="touch-btn-arrow" id="btn-down" ontouchstart="keyboard.DOWN = true" ontouchend="keyboard.DOWN = false"></div>
                    <div class="touch-btn-arrow" id="btn-right" ontouchstart="keyboard.RIGHT = true" ontouchend="keyboard.RIGHT = false"></div>
                </div>
            </div>
            <div id="action-buttons">
                <img src="img/Alternative_Grafiken-Sharkie/Alternative Grafiken - Sharkie/1.Sharkie/4.Attack/Bubble trap/Bubble.png" class="touch-btn" id="btn-bubble" ontouchstart="keyboard.D = true" ontouchend="keyboard.D = false">
                <img src="img/Alternative_Grafiken-Sharkie/Alternative Grafiken - Sharkie/1.Sharkie/4.Attack/Bubble trap/Poisoned Bubble (for whale).png" class="touch-btn" id="btn-poison" ontouchstart="keyboard.SPACE = true" ontouchend="keyboard.SPACE = false">
            </div>
        </div>


        <div id="pause-menu" class="hidden">
            <div id="pause-content">
                <h2>Pause</h2>
                <div class="pause-btn" onclick="togglePause()">▶ Weiter</div>
                <div class="pause-btn" onclick="openSettings()">🔊 Sound</div>
                <div class="pause-btn" onclick="goHome()">🏠 Home</div>
            </div>
        </div>

    </div>

    <div class="bubble" style="width:8px; height:8px; left:8%; animation-duration:4s;"></div>
    <div class="bubble" style="width:14px; height:14px; left:18%; animation-duration:5s; animation-delay:1s;"></div>
    <div class="bubble" style="width:6px; height:6px; left:28%; animation-duration:3.5s; animation-delay:2s;"></div>
    <div class="bubble" style="width:10px; height:10px; left:40%; animation-duration:6s; animation-delay:0.5s;"></div>
    <div class="bubble" style="width:16px; height:16px; left:52%; animation-duration:4.5s; animation-delay:1.5s;"></div>
    <div class="bubble" style="width:7px; height:7px; left:63%; animation-duration:5.5s; animation-delay:3s;"></div>
    <div class="bubble" style="width:12px; height:12px; left:75%; animation-duration:3s; animation-delay:0.8s;"></div>
    <div class="bubble" style="width:5px; height:5px; left:85%; animation-duration:4s; animation-delay:2.5s;"></div>
    <div class="bubble" style="width:9px; height:9px; left:92%; animation-duration:5s; animation-delay:1.2s;"></div>

    <a href="impressum.html" id="impressum-link">Impressum</a>
</body>

</html>
