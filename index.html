<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Sharkie</title>
    <script src="./models/drawable-object.class.js"></script>
    <script src="./models/movable-object.class.js"></script>
    <script src="./models/background-object.class.js"></script>
    <script src="./models/character.class.js"></script>
    <script src="./models/puffer-fish.class.js"></script>
    <script src="./models/jellyfish.class.js"></script>
    <script src="./models/dangerous-jellyfish.class.js"></script>
    <script src="./models/endboss.class.js"></script>
    <script src="./models/coin.class.js"></script>
    <script src="./models/poison.class.js"></script>
    <script src="./models/throwable-object.class.js"></script>
    <script src="./models/poison-bubble.class.js"></script>
    <script src="./models/light.class.js"></script>
    <script src="./models/endboss-bar.class.js"></script>
    <script src="./models/keyboard.class.js"></script>
    <script src="./models/level.class.js"></script>
    <script src="./levels/level1.js"></script>
    <script src="./models/world.class.js"></script>
    <script src="./js/game.js"></script>
</head>

<body onload="init()">

    <h1>Sharkie</h1>

    <!-- Start Buttons -->
    <div id="start-buttons">
        <div class="start-btn-item" onclick="openSettings()">
            <img src="img/Alternative_Grafiken-Sharkie/Alternative Grafiken - Sharkie/7.Icons/icons8-settings-144.svg">
            <span>Settings</span>
        </div>
        <div class="start-btn-item" onclick="openInstructions()">
            <img src="img/Alternative_Grafiken-Sharkie/Alternative Grafiken - Sharkie/7.Icons/help.png">
            <span>Help</span>
        </div>
        <div class="start-btn-item" onclick="startGame()">
            <img src="img/Alternative_Grafiken-Sharkie/Alternative Grafiken - Sharkie/6.Botones/Start/3.png">
            <span>Start</span>
        </div>
    </div>

    <div id="game-container">

        <!-- Settings Dialog -->
        <div id="settings-dialog" class="hidden">
            <div id="settings-content">
                <span class="close-btn" onclick="closeSettings()">✕</span>
                <h2>Settings</h2>
                <div class="settings-row">
                    <span>Sound</span>
                    <button id="mute-btn" onclick="toggleMute()">🔊 On</button>
                </div>
            </div>
        </div>

        <!-- Instructions Dialog -->
        <div id="instructions-dialog" class="hidden">
            <div id="instructions-content">
                <span class="close-btn" onclick="closeInstructions()">✕</span>
                <div class="instructions-row">
                    <img src="img/Alternative_Grafiken-Sharkie/Alternative Grafiken - Sharkie/6.Botones/Tittles/Move title.png">
                    <img src="img/Alternative_Grafiken-Sharkie/Alternative Grafiken - Sharkie/6.Botones/Key/arrow keys.png">
                </div>
                <div class="instructions-row">
                    <img src="img/Alternative_Grafiken-Sharkie/Alternative Grafiken - Sharkie/6.Botones/Tittles/Attack tittle.png">
                    <img src="img/Alternative_Grafiken-Sharkie/Alternative Grafiken - Sharkie/6.Botones/Key/D key.png">
                    <img src="img/Alternative_Grafiken-Sharkie/Alternative Grafiken - Sharkie/6.Botones/Key/Space Bar key.png">
                </div>
            </div>
        </div>

        <!-- Game Over Screen -->
        <div id="gameover-screen" class="hidden">
            <img id="gameover-title" src="img/Alternative_Grafiken-Sharkie/Alternative Grafiken - Sharkie/6.Botones/Tittles/Game Over/Recurso 10.png">
            <img class="btn-action" src="img/Alternative_Grafiken-Sharkie/Alternative Grafiken - Sharkie/6.Botones/Try again/Recurso 17.png" onclick="restartGame()">
            <img class="btn-action" src="img/Alternative_Grafiken-Sharkie/Alternative Grafiken - Sharkie/6.Botones/Start/3.png" onclick="goHome()">
        </div>

        <!-- You Win Screen -->
        <div id="youwin-screen" class="hidden">
            <img id="youwin-title" src="img/Alternative_Grafiken-Sharkie/Alternative Grafiken - Sharkie/6.Botones/Tittles/You win/Recurso 22.png">
            <img class="btn-action" src="img/Alternative_Grafiken-Sharkie/Alternative Grafiken - Sharkie/6.Botones/Try again/Recurso 17.png" onclick="restartGame()">
            <img class="btn-action" src="img/Alternative_Grafiken-Sharkie/Alternative Grafiken - Sharkie/6.Botones/Start/3.png" onclick="goHome()">
        </div>

        <!-- Canvas -->
        <canvas id="canvas" width="720" height="480" class="hidden"></canvas>
        <div id="btn-fullscreen-ingame" onclick="toggleFullscreen()" class="hidden">⛶</div>

    </div>

</body>

</html>
